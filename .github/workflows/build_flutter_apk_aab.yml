name: Build & Release Flutter TV Remote (APK & AAB)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (all, aab, apk)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - aab
          - apk

jobs:
  build:
    name: Build Flutter APK & AAB
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Repository Source Code
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java Development Kit (JDK 17)
      - name: ☕ Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Step 3: Set up Flutter Environment
      - name: 🚀 Set up Flutter (3.24.x / 3.x Stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:keys:-:hash:'

      # Step 4: Verify Flutter and Dart Tools
      - name: 🔍 Doctor & Environment Check
        run: |
          flutter --version
          flutter doctor -v

      # Step 5: Install Flutter Dependencies
      - name: 📦 Install Flutter Dependencies
        run: |
          if [ -d "flutter_universal_remote_core" ]; then
            cd flutter_universal_remote_core
            flutter pub get
            cd ..
          elif [ -f "pubspec.yaml" ]; then
            flutter pub get
          fi

      # Step 6: Decode Release Keystore & Configure key.properties
      - name: 🔑 Configure Android Keystore Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            echo "storePassword=$KEYSTORE_PASSWORD" > android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "storeFile=upload-keystore.jks" >> android/key.properties
            echo "✅ Production keystore and key.properties loaded from GitHub Secrets."
          else
            echo "⚠️ No KEYSTORE_BASE64 secret found. Generating temporary CI signing keystore..."
            keytool -genkey -v \
              -keystore android/app/upload-keystore.jks \
              -storetype JKS -keyalg RSA -keysize 2048 -validity 10000 \
              -alias upload -storepass ci_password123 -keypass ci_password123 \
              -dname "CN=CI Runner, O=UniversalRemote, C=IN"
            echo "storePassword=ci_password123" > android/key.properties
            echo "keyPassword=ci_password123" >> android/key.properties
            echo "keyAlias=upload" >> android/key.properties
            echo "storeFile=upload-keystore.jks" >> android/key.properties
          fi

      # Step 7: Build Android App Bundle (.aab) for Google Play Console
      - name: 📦 Build Release Android App Bundle (AAB)
        if: ${{ github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == '' }}
        run: |
          echo "Building obfuscated release App Bundle (Target SDK 35)..."
          flutter build appbundle --release --obfuscate --split-debug-info=build/app/outputs/symbols

      # Step 8: Build Universal Release APK (.apk) for Direct Install & Testing
      - name: 📱 Build Release APK (Universal + Split Per ABI)
        if: ${{ github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == '' }}
        run: |
          echo "Building release APKs..."
          flutter build apk --release --split-per-abi
          flutter build apk --release

      # Step 9: Archive & Upload Android App Bundle (AAB)
      - name: 📤 Upload Google Play App Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: google-play-app-bundle-aab
          path: |
            build/app/outputs/bundle/release/*.aab
          retention-days: 30

      # Step 10: Archive & Upload APKs
      - name: 📤 Upload Direct Install APKs
        uses: actions/upload-artifact@v4
        with:
          name: direct-install-release-apks
          path: |
            build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      # Step 11: Auto-Publish to GitHub Releases if a Tag is Pushed
      - name: 🚀 Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
