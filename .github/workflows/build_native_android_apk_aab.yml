name: Build Native Android Google TV Remote (APK & AAB)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (all, aab, apk)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - aab
          - apk

jobs:
  build:
    name: Build Native Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Repository Source Code
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java Development Kit (JDK 17)
      - name: ☕ Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Step 3: Grant execute permission for gradlew
      - name: 🔑 Make gradlew Executable
        run: |
          chmod +x android/gradlew

      # Step 4: Configure Keystore Signing (GitHub Secret or Automated CI Keystore)
      - name: 🔑 Configure Release Keystore Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            echo "storePassword=$KEYSTORE_PASSWORD" > android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "storeFile=upload-keystore.jks" >> android/key.properties
            echo "✅ Configured release keystore from GitHub Secrets."
          else
            echo "ℹ️ Secrets not provided. Generating CI signing keystore for automated release..."
            keytool -genkey -v \
              -keystore android/app/upload-keystore.jks \
              -storetype JKS -keyalg RSA -keysize 2048 -validity 10000 \
              -alias upload -storepass ci_password123 -keypass ci_password123 \
              -dname "CN=GoogleTvRemote, O=OmniTech, C=IN"
            echo "storePassword=ci_password123" > android/key.properties
            echo "keyPassword=ci_password123" >> android/key.properties
            echo "keyAlias=upload" >> android/key.properties
            echo "storeFile=upload-keystore.jks" >> android/key.properties
            echo "✅ Configured self-signed keystore for CI release build."
          fi

      # Step 5: Build Release APK
      - name: 📱 Build Release APK
        if: ${{ github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == '' }}
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      # Step 6: Build Google Play Android App Bundle (AAB)
      - name: 📦 Build Google Play App Bundle (AAB)
        if: ${{ github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == '' }}
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace

      # Step 7: Upload Release APK Artifact
      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: google-tv-remote-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      # Step 8: Upload Google Play App Bundle (AAB) Artifact
      - name: 📤 Upload Google Play App Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: google-tv-remote-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      # Step 9: Auto-Publish to GitHub Releases on Tag Push
      - name: 🚀 Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
          draft: false
          prerelease: false
