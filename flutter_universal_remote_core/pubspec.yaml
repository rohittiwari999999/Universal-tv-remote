name: universal_tv_remote
description: "A production cross-platform Universal TV Remote Control Flutter application supporting IR Blaster, Bluetooth LE, and Wi-Fi Smart TVs."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # 1. INFRARED TRANSMISSION (ANDROID HARDWARE)
  # ir_sensor_plugin or consumer_ir provides direct JNI bindings to Android ConsumerIrManager
  ir_sensor_plugin: ^0.1.0

  # 2. BLUETOOTH LOW ENERGY (CROSS-PLATFORM iOS & ANDROID)
  flutter_blue_plus: ^1.34.5

  # 3. NETWORK DISCOVERY & SMART TV PROTOCOLS (Wi-Fi)
  # SSDP for UPnP M-SEARCH discovery of Samsung, LG, Sony Bravia
  upnp_client: ^2.2.0
  # WebSockets for Samsung Tizen OS & LG webOS handshake
  web_socket_channel: ^2.4.5
  # HTTP client for Sony Bravia IRCC REST / Android TV API
  http: ^1.2.1
  # Network info to inspect local IP subnet
  network_info_plus: ^5.0.1

  # 4. FIREBASE & CLOUD DATABASE
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  
  # 5. LOCAL OFFLINE CACHING & FAST STORAGE
  # Hive or Isar to store IR hex patterns offline without internet latency
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # 6. ARCHITECTURE & STATE MANAGEMENT
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  get_it: ^7.7.0

  # 7. UI, HAPTICS & SOUND EFFECTS
  flutter_vibrate: ^1.3.0
  audioplayers: ^6.0.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/database/
    - assets/sounds/
    - assets/brands/
